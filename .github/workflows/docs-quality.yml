name: 文档质量检查
on:
  push:
    paths:
      - 'docs/**'
      - 'scripts/check-docs.py'
  pull_request:
    paths:
      - 'docs/**'
  workflow_dispatch:
concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: 校验 front matter / permalink / 站内链接
        run: python3 scripts/check-docs.py
