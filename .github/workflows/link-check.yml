name: 文档链接检查
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查 README 与 docs 中的链接
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --accept 200,206,429 './README.md' './docs/**/*.md' './scripts'
          fail: false
