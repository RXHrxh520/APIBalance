name: Issue 自动分流
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.issue.body || '') + ' ' + context.payload.issue.title;
            const labels = [];
            if (/DeepSeek|Kimi|Moonshot|GLM|智谱|Anthropic|Claude|火山|方舟|Codex/i.test(body)) labels.push('服务商');
            if (/401|403|429|超时|报错|失败|error/i.test(body)) labels.push('查询异常');
            if (/安装|签名|覆盖|升级|更新/i.test(body)) labels.push('安装与升级');
            if (/建议|希望|能否|增加|feature/i.test(body)) labels.push('功能建议');
            labels.push('待处理');
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, labels
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '感谢反馈。为了更快定位，请补充：\n\n- App 版本（设置 → 关于）\n- 涉及的服务商\n- 状态码或提示原文（**截图前请打码 API Key**）\n\n常见问题：https://rxhrxh520.github.io/APIBalance/faq.html\n错误码速查：https://rxhrxh520.github.io/APIBalance/errors.html'
            });
