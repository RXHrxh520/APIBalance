name: 文档站可用性
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 逐页探测线上文档站
        run: |
          set -u
          base="https://rxhrxh520.github.io/APIBalance"
          fail=0
          for p in "" "features.html" "faq.html" "errors.html" "permissions.html" "security.html" "build.html" "roadmap.html" "404.html"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 2 "$base/$p")
            echo "$code  /$p"
            case "$code" in 200|404) ;; *) fail=1 ;; esac
          done
          exit $fail
