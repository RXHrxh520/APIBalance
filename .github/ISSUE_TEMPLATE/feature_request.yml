name: 功能建议
description: 提出一个改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先看看 [路线图](https://rxhrxh520.github.io/APIBalance/apibalance/roadmap.html)，避免和「明确不做」的方向重复。
  - type: textarea
    id: scenario
    attributes:
      label: 你想解决的使用场景
      description: 描述你实际遇到的麻烦，比只写功能名有用得多
      placeholder: 例如：我有 3 个 DeepSeek 账号，切换时总要重新输入 Key
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的解决方式
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 目前你是怎么绕过的
      description: 可选，说明现状有助于判断优先级
