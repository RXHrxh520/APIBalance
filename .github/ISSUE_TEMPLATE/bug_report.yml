name: Bug 反馈
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看 [常见问题](https://rxhrxh520.github.io/APIBalance/apibalance/faq.html) 与 [错误码速查](https://rxhrxh520.github.io/APIBalance/apibalance/errors.html)。
        **任何截图或日志都不要包含 API Key。**
  - type: input
    id: version
    attributes:
      label: App 版本
      placeholder: 例如 v1.5.4（设置 → 关于 里能看到）
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机型号与 Android 版本
      placeholder: 例如 小米 14 / Android 15
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: 涉及的服务商
      options:
        - DeepSeek
        - Kimi / Moonshot
        - 智谱 GLM
        - Anthropic
        - 火山方舟
        - Kimi Code
        - GLM Coding
        - Codex
        - 与具体服务商无关
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 打开... 2. 点击... 3. 出现...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 状态码 / 提示原文 / 截图
      description: 记得打码 API Key、手机号等信息
      render: text
