# Gitee Go 流水线：Gitee 上 .github/workflows 不生效，这里是等价移植。
# 触发方式统一为 push 到 main，避免使用 Gitee 尚未支持的高级触发器。
version: 1.0
name: docs-link-audit
displayName: 文档链接巡检

triggers:
  push:
    branches:
      include:
        - main

stages:
  - name: audit
    displayName: 扫描 README 与 docs 的外链
    steps:
      - step: build@python
        name: audit
        displayName: 外链可访问性
        pythonVersion: 3.10
        commands:
          - python3 scripts/gitee/link_audit.py
