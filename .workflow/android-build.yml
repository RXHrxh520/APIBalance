# Gitee Go 流水线：Gitee 上 .github/workflows 不生效，这里是等价移植。
# 触发方式统一为 push 到 main，避免使用 Gitee 尚未支持的高级触发器。
version: 1.0
name: android-build
displayName: Android 云端构建（探测）

triggers:
  push:
    branches:
      include:
        - main

stages:
  - name: build
    displayName: JDK 17 / Gradle
    steps:
      - step: build@gradle
        name: apk
        displayName: assembleDebug
        jdkVersion: 17
        gradleVersion: 7.6
        commands:
          - java -version
          - ./gradlew --version
          - ./gradlew assembleDebug --stacktrace
        artifacts:
          - name: APK_DEBUG
            path:
              - ./app/build/outputs/apk/debug
