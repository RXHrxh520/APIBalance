# Gitee Go 流水线：Gitee 上 .github/workflows 不生效，这里是等价移植。
# 触发方式统一为 push 到 main，避免使用 Gitee 尚未支持的高级触发器。
version: 1.0
name: docs-quality
displayName: 文档质量检查

triggers:
  push:
    branches:
      include:
        - main

stages:
  - name: validate
    displayName: front matter / permalink / 站内链接
    steps:
      - step: build@python
        name: docs
        displayName: 校验文档
        pythonVersion: 3.10
        commands:
          - python3 scripts/check-docs.py
