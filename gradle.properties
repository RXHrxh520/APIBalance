org.gradle.vfs.watch=false
org.gradle.daemon=false
org.gradle.jvmargs=-Dfile.encoding=UTF-8
# aapt2 的路径由本机构建环境提供，不入库
# 不让 AGP 自己去 dl.google.com 拉缺失组件
android.builder.sdkDownload=false

# ---------------------------------------------------------------------------
# 签名口令不再明文保存在仓库里（旧版本曾在此硬编码，已移除）。
# 构建时按以下任一方式提供，app/build.gradle 会依序读取：
#   1) 环境变量：  export RXH_STORE_PASS=...   export RXH_KEY_PASS=...
#   2) 根目录 keystore.properties（已被 .gitignore 忽略，切勿提交/打包）
#   3) Gradle 参数： -PRXH_STORE_PASS=... -PRXH_KEY_PASS=...
# 三者都没有时会直接报错终止，避免产出未签名/错误签名的包。
# ---------------------------------------------------------------------------
