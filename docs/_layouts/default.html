<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" href="{{ site.baseurl }}/assets/brand/app-icon.png">
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
</head>
<body>
<header class="site-header">
  <button class="dev-avatar" type="button" title="开发者" aria-label="开发者头像">
    <img src="https://github.com/RXHrxh520.png?size=80" alt="开发者头像" width="40" height="40">
  </button>
  <div class="wrap header-inner">
    <div class="brand">
      <a href="{{ site.baseurl }}/" class="brand-name"><img class="logo" src="{{ site.baseurl }}/assets/brand/app-icon.png" alt="APIBalance"><span>APIBalance</span></a>
      <span class="brand-sub">Android · 多服务商 AI 余额查询</span>
    </div>
    <nav class="nav">
      <a href="{{ site.baseurl }}/"{% if page.url == "/" %} class="on"{% endif %}>总览</a>
      <a href="{{ site.baseurl }}/features.html">功能</a>
      <a href="{{ site.baseurl }}/faq.html">安装与 FAQ</a>
      <a href="{{ site.baseurl }}/errors.html">错误码</a>
      <a href="{{ site.baseurl }}/permissions.html">权限</a>
      <a href="{{ site.baseurl }}/security.html">隐私</a>
      <a href="{{ site.baseurl }}/build.html">构建</a>
      <a href="{{ site.baseurl }}/roadmap.html">路线图</a>
      <a href="https://github.com/RXHrxh520/APIBalance" class="gh">GitHub</a>
    </nav>
  </div>
</header>
<main class="wrap main">
{{ content }}
</main>
<footer class="site-footer">
  <div class="wrap">
    <p>APIBalance · 开源免费 · BSD-3-Clause · <a href="https://github.com/RXHrxh520/APIBalance">GitHub 仓库</a> · <a href="https://github.com/RXHrxh520/APIBalance/releases/latest">下载 APK</a></p>
    <p class="muted">文档站不收集访问者数据</p>
  </div>
</footer>
<script>
(function () {
  var avatar = document.querySelector('.dev-avatar');
  if (!avatar) return;
  var clicks = 0;
  avatar.addEventListener('click', function () {
    clicks += 1;
    if (clicks !== 10) return;
    clicks = 0;
    var heart = document.createElement('span');
    heart.className = 'heart-pop';
    heart.textContent = '♥';
    heart.setAttribute('aria-hidden', 'true');
    document.body.appendChild(heart);
    window.setTimeout(function () { heart.remove(); }, 1600);
  });
})();
</script>
<script>
(function () {
  var root = document.querySelector('[data-carousel]');
  if (!root) return;
  var slides = Array.prototype.slice.call(root.querySelectorAll('.carousel-slide'));
  var dots = Array.prototype.slice.call(root.querySelectorAll('.carousel-dot'));
  var index = 0;
  var timer;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function show(n) {
    index = (n + slides.length) % slides.length;
    slides.forEach(function (slide, i) {
      slide.classList.toggle('is-active', i === index);
    });
    dots.forEach(function (dot, i) {
      dot.classList.toggle('is-active', i === index);
      if (i === index) dot.setAttribute('aria-current', 'true');
      else dot.removeAttribute('aria-current');
    });
  }
  function stop() {
    if (timer) window.clearInterval(timer);
    timer = null;
  }
  function start() {
    stop();
    if (reduce) return;
    timer = window.setInterval(function () { show(index + 1); }, 5000);
  }
  var prev = root.querySelector('.carousel-arrow.prev');
  var next = root.querySelector('.carousel-arrow.next');
  if (prev) prev.addEventListener('click', function () { show(index - 1); start(); });
  if (next) next.addEventListener('click', function () { show(index + 1); start(); });
  dots.forEach(function (dot, i) {
    dot.addEventListener('click', function () { show(i); start(); });
  });
  var startX = null;
  root.addEventListener('touchstart', function (event) {
    if (event.touches.length === 1) startX = event.touches[0].clientX;
  }, { passive: true });
  root.addEventListener('touchend', function (event) {
    if (startX === null) return;
    var delta = event.changedTouches[0].clientX - startX;
    startX = null;
    if (Math.abs(delta) < 40) return;
    show(index + (delta < 0 ? 1 : -1));
    start();
  }, { passive: true });
  root.addEventListener('mouseenter', stop);
  root.addEventListener('mouseleave', start);
  root.addEventListener('focusin', stop);
  root.addEventListener('focusout', function () { window.setTimeout(start, 0); });
  show(0);
  if (!reduce) start();
})();
</script>
</body>
</html>
